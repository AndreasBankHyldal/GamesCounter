# Render Blueprint for the boardgame.io game server (apps/server).
# In Render: New > Blueprint, point it at this repo, and it reads this file.
# The web app (apps/web) is deployed separately on Vercel, not here.
databases:
  # Persistent match storage so games survive restarts / spin-downs.
  - name: gamescounter-db
    plan: free

services:
  - type: web
    name: gamescounter-server
    runtime: node
    plan: free
    # Build from the repo ROOT (not apps/server) so npm workspaces can resolve
    # the @gamescounter/games dependency.
    rootDir: .
    buildCommand: npm install --legacy-peer-deps
    startCommand: npm run start:server
    envVars:
      # Render injects PORT and RENDER_EXTERNAL_URL automatically.
      - key: CLIENT_ORIGIN
        sync: false # set this to your Vercel URL in the dashboard after deploy
      - key: DATABASE_URL
        fromDatabase:
          name: gamescounter-db
          property: connectionString
